<link rel="canonical" href="https://console.djlabsiam.com/book.html">

<style>
  :root { --bg: #F5F4F0; --text: #0F0F0F; --line: #CFCCC3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151515; --text: #F2F0EA; --line: #3A3935; } }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { margin: 0 0 12px; }
  a { color: inherit; font-weight: 600; overflow-wrap: anywhere; }
  .box { border: 1px solid var(--line); padding: 14px 16px; }
</style>
</head>
<body>
<main>
  <h1>ย้ายไปที่อยู่ใหม่แล้ว</h1>
  <p>ระบบร้าน DJ LAB SIAM ย้ายไปที่ <strong>console.djlabsiam.com</strong> แล้ว กำลังพาไปให้อัตโนมัติ</p>

</main>
<script>
(function () {
  var BASE = 'https://console.djlabsiam.com/', PREFIX = '/djlab-booking-app/';
  var p = location.pathname;
  var rel = p.indexOf(PREFIX) === 0 ? p.slice(PREFIX.length) : (p === PREFIX.slice(0, -1) ? '' : p.replace(/^\/+/, ''));
  var to = BASE + rel + location.search + location.hash;
  var a = document.getElementById('go');
  if (a) { a.href = to; a.textContent = to; }
  location.replace(to);
})();
</script>
