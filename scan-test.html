<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#c8232c">
<title>ทดสอบสแกนบาร์โค้ด — DJ LAB SIAM</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f7f7;
    --accent: #c8232c;
    --green: #1a8f4a;
    --gold: #b8860b;
    --text: #111111;
    --text2: #555555;
    --border: #dedede;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 40px;
  }
  .header {
    background: #111111;
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 3px solid var(--accent);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo-box {
    background: var(--accent);
    color: white;
    font-weight: 900;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .logo-text { font-size: 16px; font-weight: 700; color: #ffffff; }
  .page { padding: 16px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-title { font-size: 14px; font-weight: 700; color: var(--text2); margin-bottom: 12px; }
  #videoWrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* กรอบนี้คือพื้นที่ที่อ่านจริง ต้องตรงกับ ROI ในโค้ดเป๊ะๆ */
  #reticle {
    position: absolute;
    left: 8%; right: 8%; top: 32%; bottom: 32%;
    border: 3px solid rgba(200,35,44,0.9);
    border-radius: 8px;
    pointer-events: none;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,0.35);
  }
  .btn {
    display: block; width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: none;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 10px;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-dark { background: #333; color: #fff; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { margin-bottom: 0; }
  .result {
    background: #fff;
    border: 2px solid var(--green);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .result .fmt { font-size: 13px; color: var(--green); font-weight: 700; letter-spacing: 0.5px; }
  .result .val {
    font-size: 22px; font-weight: 900; word-break: break-all; margin: 4px 0;
    font-family: ui-monospace, Menlo, monospace;
  }
  .result .meta { font-size: 14px; color: var(--text2); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
  .stat .label { font-size: 12px; color: var(--text2); }
  .stat .value { font-size: 20px; font-weight: 900; margin-top: 2px; }
  .info-row {
    display: flex; justify-content: space-between; font-size: 14px;
    padding: 6px 0; border-bottom: 1px solid var(--border); gap: 12px;
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .k { color: var(--text2); flex-shrink: 0; }
  .info-row .v { font-weight: 600; text-align: right; word-break: break-all; }
  .alert {
    padding: 12px 14px; border-radius: 10px; font-size: 14px;
    margin-bottom: 12px; border-left: 3px solid; line-height: 1.5;
  }
  .alert-gold { background: rgba(184,134,11,0.08); border-color: var(--gold); color: #8a6508; }
  .alert-red { background: rgba(200,35,44,0.08); border-color: var(--accent); color: var(--accent); }
  .log-item {
    font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; gap: 10px;
  }
  .log-item:last-child { border-bottom: none; }
  .log-item .code { font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  .log-item .t { color: var(--text2); flex-shrink: 0; }
</style>
</head>
<body>

<div class="header">
  <div class="logo-box">DJ LAB</div>
  <div class="logo-text">ทดสอบสแกนบาร์โค้ด</div>
</div>

<div class="page">
  <div class="alert alert-gold">
    เล็งให้บาร์โค้ด <strong>อยู่ในกรอบแดง</strong> — อ่านเฉพาะในกรอบเท่านั้น
    สแกนติดแล้วจะหยุดให้อ่านผล กด “สแกนใบถัดไป” เพื่อจับเวลาใบใหม่
  </div>

  <div id="errBox" class="alert alert-red" style="display:none;"></div>

  <div id="videoWrap">
    <video id="video" playsinline muted></video>
    <div id="reticle"></div>
  </div>

  <button class="btn btn-primary" id="startBtn">เริ่มสแกน</button>
  <div class="btn-row">
    <button class="btn btn-dark" id="torchBtn" disabled>เปิดไฟฉาย</button>
    <button class="btn btn-dark" id="resetBtn">ล้างผลทดสอบ</button>
  </div>

  <div id="lastResult"></div>

  <div class="card">
    <div class="card-title">สรุปผลทดสอบ</div>
    <div class="stat-grid">
      <div class="stat"><div class="label">สแกนสำเร็จ</div><div class="value" id="statCount">0</div></div>
      <div class="stat"><div class="label">เร็วสุด</div><div class="value" id="statBest">—</div></div>
      <div class="stat"><div class="label">เฉลี่ย</div><div class="value" id="statAvg">—</div></div>
      <div class="stat"><div class="label">ช้าสุด</div><div class="value" id="statWorst">—</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">ข้อมูลเครื่อง</div>
    <div class="info-row"><span class="k">วิธีถอดรหัส</span><span class="v" id="infoEngine">—</span></div>
    <div class="info-row"><span class="k">ความละเอียดกล้อง</span><span class="v" id="infoRes">—</span></div>
    <div class="info-row"><span class="k">ไฟฉาย</span><span class="v" id="infoTorch">—</span></div>
  </div>

  <div class="card">
    <div class="card-title">ประวัติการสแกน</div>
    <div id="logList" style="font-size:14px;color:var(--text2);">ยังไม่มีการสแกน</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
// บนมือถือเปิด console ดูไม่ได้ ถ้าไม่ดักไว้ error จะกลายเป็น "กดแล้วไม่มีอะไรเกิดขึ้น"
function showFatalError(msg) {
  let box = document.getElementById('fatalError');
  if (!box) {
    box = document.createElement('div');
    box.id = 'fatalError';
    box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#c8232c;' +
      'color:#fff;font:14px/1.5 -apple-system,sans-serif;padding:12px 34px 12px 14px;' +
      'white-space:pre-wrap;word-break:break-word;max-height:45vh;overflow:auto;';
    const close = document.createElement('button');
    close.textContent = '✕';
    close.style.cssText = 'position:absolute;top:6px;right:8px;background:transparent;border:none;' +
      'color:#fff;font-size:20px;padding:4px 8px;';
    close.addEventListener('click', () => box.remove());
    box.appendChild(close);
    document.body.appendChild(box);
  }
  let t = box.querySelector('.msg');
  if (!t) { t = document.createElement('div'); t.className = 'msg'; box.appendChild(t); }
  t.textContent = '⚠️ ' + msg;
}
window.addEventListener('error', e => showFatalError(e.message));
window.addEventListener('unhandledrejection', e => {
  const r = e.reason;
  showFatalError('Promise: ' + (r && r.message ? r.message : String(r)));
});

// รูปแบบบาร์โค้ดที่ป้ายกล่องใช้จริง: Code128/Code39 = SER. NO., EAN-13 = รหัสสินค้า
const NATIVE_FORMATS = ['code_128', 'code_39', 'ean_13', 'qr_code'];

// สัดส่วนกรอบอ่าน ต้องตรงกับ CSS ของ #reticle เป๊ะๆ ไม่งั้นจะอ่านนอกกรอบที่ผู้ใช้เห็น
const ROI = { left: 0.08, right: 0.92, top: 0.32, bottom: 0.68 };

const videoEl  = document.getElementById('video');
const wrapEl   = document.getElementById('videoWrap');
const startBtn = document.getElementById('startBtn');
const torchBtn = document.getElementById('torchBtn');
const resetBtn = document.getElementById('resetBtn');
const errBox   = document.getElementById('errBox');

const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

let stream = null, track = null;
let scanning = false, torchOn = false;
let detector = null, zxingReader = null;
let scanStartedAt = 0;
let times = [];
let lastZxingAt = 0;

function showError(msg) { errBox.textContent = msg; errBox.style.display = ''; }
const fmtMs = ms => ms < 1000 ? Math.round(ms) + ' มิลลิวินาที' : (ms / 1000).toFixed(1) + ' วินาที';
const fmtShort = ms => ms < 1000 ? Math.round(ms) + 'ms' : (ms / 1000).toFixed(1) + 's';

function renderStats() {
  document.getElementById('statCount').textContent = times.length;
  const ids = ['statBest', 'statAvg', 'statWorst'];
  if (!times.length) { ids.forEach(i => document.getElementById(i).textContent = '—'); return; }
  document.getElementById('statBest').textContent  = fmtShort(Math.min(...times));
  document.getElementById('statWorst').textContent = fmtShort(Math.max(...times));
  document.getElementById('statAvg').textContent   = fmtShort(times.reduce((a, b) => a + b, 0) / times.length);
}

// วาดเฉพาะพื้นที่ในกรอบแดงลง canvas — เป็นตัวกันไม่ให้อ่านบาร์โค้ดใบอื่นที่อยู่นอกกรอบ
function drawROI() {
  const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
  if (!vw || !vh) return false;
  const sx = Math.round(vw * ROI.left);
  const sy = Math.round(vh * ROI.top);
  const sw = Math.round(vw * (ROI.right - ROI.left));
  const sh = Math.round(vh * (ROI.bottom - ROI.top));
  if (canvas.width !== sw || canvas.height !== sh) { canvas.width = sw; canvas.height = sh; }
  ctx.drawImage(videoEl, sx, sy, sw, sh, 0, 0, sw, sh);
  return true;
}

function onDecoded(text, format) {
  // หยุดทันทีที่อ่านได้ — ปล่อยให้วนต่อจะอ่านใบเดิมซ้ำรัวๆ จนอ่านผลไม่ทัน
  scanning = false;
  const elapsed = performance.now() - scanStartedAt;
  times.push(elapsed);
  if (navigator.vibrate) navigator.vibrate(120);

  document.getElementById('lastResult').innerHTML =
    '<div class="result">' +
      '<div class="fmt">' + String(format) + '</div>' +
      '<div class="val">' + String(text).replace(/</g, '&lt;') + '</div>' +
      '<div class="meta">ใช้เวลา ' + fmtMs(elapsed) + '</div>' +
    '</div>';

  const list = document.getElementById('logList');
  if (times.length === 1) list.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'log-item';
  row.innerHTML = '<span class="code">' + String(text).replace(/</g, '&lt;') + '</span>' +
                  '<span class="t">' + fmtShort(elapsed) + '</span>';
  list.prepend(row);

  renderStats();
  startBtn.disabled = false;
  startBtn.textContent = 'สแกนใบถัดไป';
}

function decodeWithZxing() {
  // ZXing โยน NotFoundException ทุกเฟรมที่อ่านไม่ได้ ซึ่งแพง — จำกัดไว้ ~10 ครั้ง/วินาที
  const now = performance.now();
  if (now - lastZxingAt < 100) return;
  lastZxingAt = now;
  try {
    const source = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
    const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(source));
    const result = zxingReader.decode(bitmap);
    if (result) onDecoded(result.getText(), result.getBarcodeFormat());
  } catch (e) {
    // ไม่เจอบาร์โค้ดในเฟรมนี้ = เรื่องปกติ ลองเฟรมถัดไป
  } finally {
    if (zxingReader.reset) zxingReader.reset();
  }
}

async function tick() {
  if (!scanning) return;
  if (drawROI()) {
    if (detector) {
      try {
        const codes = await detector.detect(canvas);
        if (codes.length && scanning) onDecoded(codes[0].rawValue, codes[0].format);
      } catch (e) { /* เฟรมนี้อ่านไม่ได้ ข้ามไป */ }
    } else {
      decodeWithZxing();
    }
  }
  if (scanning) requestAnimationFrame(tick);
}

async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1920 }, height: { ideal: 1080 },
      focusMode: { ideal: 'continuous' },
    },
    audio: false,
  });
  videoEl.srcObject = stream;
  await videoEl.play();

  track = stream.getVideoTracks()[0];
  const s = track.getSettings();
  document.getElementById('infoRes').textContent = (s.width || '?') + ' × ' + (s.height || '?');
  // ให้กรอบภาพมีสัดส่วนเท่าภาพจริง object-fit:cover จะได้ไม่ครอบตัดภาพ
  // ทำให้กรอบแดงบนจอตรงกับพื้นที่ที่อ่านจริงพอดี
  if (s.width && s.height) wrapEl.style.aspectRatio = s.width + ' / ' + s.height;

  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps && 'torch' in caps) {
    torchBtn.disabled = false;
    document.getElementById('infoTorch').textContent = 'รองรับ';
  } else {
    document.getElementById('infoTorch').textContent = 'ไม่รองรับบนเครื่องนี้';
  }
}

async function setupEngine() {
  if ('BarcodeDetector' in window) {
    try {
      const supported = await BarcodeDetector.getSupportedFormats();
      const usable = NATIVE_FORMATS.filter(f => supported.includes(f));
      if (usable.length) {
        detector = new BarcodeDetector({ formats: usable });
        document.getElementById('infoEngine').textContent = 'ระบบในตัวของเครื่อง';
        return;
      }
    } catch (e) { /* ใช้ไม่ได้ ตกไปใช้ ZXing */ }
  }
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.QR_CODE,
  ]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  zxingReader = new ZXing.MultiFormatReader();
  zxingReader.setHints(hints);
  document.getElementById('infoEngine').textContent = 'ไลบรารี ZXing (สำรอง)';
}

async function start() {
  errBox.style.display = 'none';
  startBtn.disabled = true;
  try {
    if (!stream) {
      startBtn.textContent = 'กำลังเปิดกล้อง...';
      await startCamera();
      await setupEngine();
    }
    scanning = true;
    scanStartedAt = performance.now();
    startBtn.textContent = 'กำลังสแกน — เล็งบาร์โค้ดเข้ากรอบแดง';
    requestAnimationFrame(tick);
  } catch (err) {
    startBtn.disabled = false;
    startBtn.textContent = 'เริ่มสแกน';
    showError('เปิดกล้องไม่สำเร็จ: ' + err.message +
      ' — บน iPhone ต้องเปิดหน้านี้ด้วย Safari และกดอนุญาตให้ใช้กล้อง');
  }
}

torchBtn.addEventListener('click', async () => {
  if (!track) return;
  torchOn = !torchOn;
  try {
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    torchBtn.textContent = torchOn ? 'ปิดไฟฉาย' : 'เปิดไฟฉาย';
  } catch (err) {
    showError('เปิดไฟฉายไม่สำเร็จบนเครื่องนี้');
  }
});

resetBtn.addEventListener('click', () => {
  times = [];
  document.getElementById('lastResult').innerHTML = '';
  document.getElementById('logList').textContent = 'ยังไม่มีการสแกน';
  renderStats();
});

startBtn.addEventListener('click', start);
</script>
</body>
</html>
