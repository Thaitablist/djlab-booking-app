<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#ffffff"/>

  <!-- Vinyl Record -->
  <circle cx="256" cy="270" r="150" fill="#111111" stroke="#333333" stroke-width="4"/>
  <circle cx="256" cy="270" r="110" fill="#000000"/>
  <circle cx="256" cy="270" r="70" fill="#111111"/>
  <circle cx="256" cy="270" r="30" fill="#c8232c"/>
  <circle cx="256" cy="270" r="12" fill="#111111"/>

  <!-- Groove lines -->
  <circle cx="256" cy="270" r="90" fill="none" stroke="#333333" stroke-width="2" opacity="0.8"/>
  <circle cx="256" cy="270" r="130" fill="none" stroke="#333333" stroke-width="2" opacity="0.8"/>
  <circle cx="256" cy="270" r="50" fill="none" stroke="#333333" stroke-width="1.5" opacity="0.8"/>

  <!-- DJ LAB Red Box -->
  <rect x="60" y="60" width="200" height="70" rx="12" fill="#c8232c"/>
  <text x="160" y="107" font-family="Arial Black, sans-serif" font-size="32" font-weight="900"
    fill="white" text-anchor="middle" letter-spacing="1">DJ LAB</text>

  <!-- SIAM text -->
  <text x="290" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="700"
    fill="#111111" letter-spacing="2">SIAM</text>

  <!-- Tonearm -->
  <line x1="360" y1="100" x2="306" y2="220" stroke="#555555" stroke-width="5" stroke-linecap="round"/>
  <circle cx="360" cy="100" r="14" fill="none" stroke="#555555" stroke-width="4"/>
  <circle cx="306" cy="220" r="6" fill="#c8232c"/>
</svg>
