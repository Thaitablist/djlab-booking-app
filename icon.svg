<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0f0f1a"/>

  <!-- Vinyl Record -->
  <circle cx="256" cy="270" r="150" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="4"/>
  <circle cx="256" cy="270" r="110" fill="#0d0d1a"/>
  <circle cx="256" cy="270" r="70" fill="#1a1a2e"/>
  <circle cx="256" cy="270" r="30" fill="#e63946"/>
  <circle cx="256" cy="270" r="12" fill="#0f0f1a"/>

  <!-- Groove lines -->
  <circle cx="256" cy="270" r="90" fill="none" stroke="#2a2a4a" stroke-width="2" opacity="0.6"/>
  <circle cx="256" cy="270" r="130" fill="none" stroke="#2a2a4a" stroke-width="2" opacity="0.6"/>
  <circle cx="256" cy="270" r="50" fill="none" stroke="#2a2a4a" stroke-width="1.5" opacity="0.6"/>

  <!-- DJ LAB Red Box -->
  <rect x="60" y="60" width="200" height="70" rx="12" fill="#e63946"/>
  <text x="160" y="107" font-family="Arial Black, sans-serif" font-size="32" font-weight="900"
    fill="white" text-anchor="middle" letter-spacing="1">DJ LAB</text>

  <!-- SIAM text -->
  <text x="290" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="700"
    fill="#f1faee" letter-spacing="2">SIAM</text>

  <!-- Tonearm -->
  <line x1="360" y1="100" x2="306" y2="220" stroke="#a8dadc" stroke-width="5" stroke-linecap="round"/>
  <circle cx="360" cy="100" r="14" fill="none" stroke="#a8dadc" stroke-width="4"/>
  <circle cx="306" cy="220" r="6" fill="#e63946"/>
</svg>
